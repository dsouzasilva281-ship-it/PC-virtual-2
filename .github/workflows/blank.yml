name: Virtual PC - Ubuntu + Tailscale + RDP 777

on:
  workflow_dispatch:

jobs:
  virtual-pc:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # INSTALAR DESKTOP
      # ==========================================
      - name: Instalar XFCE + XRDP
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xfce4-session \
            xrdp \
            xorgxrdp \
            dbus \
            dbus-x11 \
            policykit-1 \
            network-manager \
            netcat-openbsd

          echo "XFCE instalado."
          echo "XRDP instalado."

      # ==========================================
      # CRIAR USUÁRIO
      # ==========================================
      - name: Criar usuário zezin
        shell: bash
        run: |
          set -e

          USERNAME="zezin"
          PASSWORD="zezin123"

          if id "$USERNAME" >/dev/null 2>&1; then
            sudo usermod -s /bin/bash "$USERNAME"
          else
            sudo useradd \
              --create-home \
              --shell /bin/bash \
              "$USERNAME"
          fi

          echo "$USERNAME:$PASSWORD" | sudo chpasswd

          sudo usermod -aG sudo "$USERNAME"

          echo "Usuário configurado."

      # ==========================================
      # CONFIGURAR SESSÃO XFCE
      # ==========================================
      - name: Configurar sessão XFCE
        shell: bash
        run: |
          set -e

          USERNAME="zezin"
          HOME_DIR="/home/$USERNAME"

          sudo mkdir -p "$HOME_DIR"

          sudo tee "$HOME_DIR/.xsession" > /dev/null <<'EOF'
          #!/bin/bash

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          exec dbus-run-session -- startxfce4
          EOF

          sudo chmod +x "$HOME_DIR/.xsession"

          sudo chown "$USERNAME:$USERNAME" \
            "$HOME_DIR/.xsession"

          # Criar configuração mínima do XFCE
          sudo -u "$USERNAME" mkdir -p \
            "$HOME_DIR/.config/xfce4"

          # Impedir bloqueio automático da sessão
          sudo -u "$USERNAME" mkdir -p \
            "$HOME_DIR/.config/autostart"

          # Configuração de ambiente para XRDP
          sudo tee /etc/environment > /dev/null <<'EOF'
          LANG=C.UTF-8
          LC_ALL=C.UTF-8
          EOF

      # ==========================================
      # CONFIGURAR XRDP
      # ==========================================
      - name: Configurar XRDP
        shell: bash
        run: |
          set -e

          sudo adduser xrdp ssl-cert || true

          sudo cp /etc/xrdp/startwm.sh \
            /etc/xrdp/startwm.sh.backup

          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh

          if [ -r /etc/profile ]; then
              . /etc/profile
          fi

          if [ -r "$HOME/.profile" ]; then
              . "$HOME/.profile"
          fi

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          exec "$HOME/.xsession"
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

          sudo sed -i 's/^test -x \/etc\/X11\/Xsession/#&/' \
            /etc/xrdp/startwm.sh || true

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

          sleep 5

          echo "===== XRDP ====="
          sudo systemctl --no-pager status xrdp || true

      # ==========================================
      # INSTALAR TAILSCALE
      # ==========================================
      - name: Instalar Tailscale
        shell: bash
        run: |
          set -e

          curl -fsSL https://tailscale.com/install.sh | sh

          tailscale version

      # ==========================================
      # CONECTAR TAILSCALE
      # ==========================================
      - name: Conectar Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        shell: bash
        run: |
          set -e

          if [ -z "$TS_AUTHKEY" ]; then
            echo "ERRO: Secret TS_AUTHKEY não configurado."
            exit 1
          fi

          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="github-rdp-${GITHUB_RUN_ID}"

          sleep 5

          echo ""
          echo "===== TAILSCALE ====="

          sudo tailscale status

          echo ""
          echo "===== IP TAILSCALE ====="

          sudo tailscale ip -4

      # ==========================================
      # TESTAR XRDP
      # ==========================================
      - name: Testar servidor RDP
        shell: bash
        run: |
          set -e

          echo "===== SERVIÇO ====="

          if ! sudo systemctl is-active --quiet xrdp; then
            echo "XRDP não está funcionando."
            sudo journalctl -u xrdp --no-pager -n 100
            exit 1
          fi

          echo "XRDP: OK"

          echo ""
          echo "===== PORTA 3389 ====="

          sudo ss -lntp | grep ':3389'

          echo ""
          echo "===== TESTE ====="

          nc -zv 127.0.0.1 3389

          echo ""
          echo "RDP funcionando."

      # ==========================================
      # MOSTRAR DADOS
      # ==========================================
      - name: Mostrar dados da máquina
        shell: bash
        run: |
          IP=$(sudo tailscale ip -4)

          echo ""
          echo "========================================"
          echo "          VIRTUAL PC ONLINE"
          echo "========================================"
          echo ""
          echo "ENDEREÇO RDP:"
          echo "$IP:3389"
          echo ""
          echo "USUÁRIO:"
          echo "zezin"
          echo ""
          echo "SENHA:"
          echo "zezin123"
          echo ""
          echo "DESKTOP:"
          echo "XFCE"
          echo ""
          echo "REDE:"
          echo "Tailscale"
          echo ""
          echo "========================================"

      # ==========================================
      # MANTER RUNNER
      # ==========================================
      - name: Manter máquina ativa
        shell: bash
        run: |
          echo "Virtual PC ativo."

          while true; do
            echo "[$(date '+%H:%M:%S')] RDP + XFCE + Tailscale OK"
            sleep 60
          done
