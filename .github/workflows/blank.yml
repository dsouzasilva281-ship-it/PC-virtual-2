name: Virtual PC - Ubuntu + Tailscale + RDP

on:
  workflow_dispatch:

jobs:
  virtual-pc:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar XFCE + XRDP
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xrdp \
            xorgxrdp \
            dbus-x11 \
            netcat-openbsd

      - name: Criar usuário RDP
        shell: bash
        run: |
          USERNAME="zezin"
          PASSWORD="zezin123"

          if id "$USERNAME" >/dev/null 2>&1; then
            echo "Usuário já existe."
          else
            sudo useradd -m -s /bin/bash "$USERNAME"
          fi

          echo "$USERNAME:$PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo "$USERNAME"

          sudo tee "/home/$USERNAME/.xsession" > /dev/null <<'EOF'
          #!/bin/bash
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          exec startxfce4
          EOF

          sudo chown "$USERNAME:$USERNAME" "/home/$USERNAME/.xsession"
          sudo chmod +x "/home/$USERNAME/.xsession"

      - name: Configurar XRDP
        shell: bash
        run: |
          sudo adduser xrdp ssl-cert || true

          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh

          export XDG_SESSION_DESKTOP=xfce
          export XDG_CURRENT_DESKTOP=XFCE

          if [ -r /etc/profile ]; then
            . /etc/profile
          fi

          exec startxfce4
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

          sleep 5

          echo "===== XRDP ====="
          sudo systemctl --no-pager status xrdp || true

          echo "===== PORTA 3389 ====="
          sudo ss -lntp | grep 3389 || true

      - name: Instalar Tailscale
        shell: bash
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          tailscale version

      - name: Conectar Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        shell: bash
        run: |
          if [ -z "$TS_AUTHKEY" ]; then
            echo "ERRO: Secret TS_AUTHKEY não configurado."
            exit 1
          fi

          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="github-rdp-${GITHUB_RUN_ID}"

          sleep 5

          echo "===== TAILSCALE STATUS ====="
          sudo tailscale status

      - name: Verificar RDP
        shell: bash
        run: |
          sudo tailscale set --shields-up=false || true

          echo "===== IP TAILSCALE ====="
          IP=$(sudo tailscale ip -4)
          echo "$IP"

          echo "===== PORTA RDP ====="
          sudo ss -lntp | grep ':3389'

          echo "===== TESTE RDP LOCAL ====="
          nc -zv 127.0.0.1 3389

          echo "===== TESTE RDP TAILSCALE ====="
          nc -zv "$IP" 3389

      - name: Mostrar dados da conexão
        shell: bash
        run: |
          IP=$(sudo tailscale ip -4)

          echo ""
          echo "========================================"
          echo "          VIRTUAL PC ONLINE"
          echo "========================================"
          echo ""
          echo "ENDEREÇO RDP:"
          echo "$IP:3389"
          echo ""
          echo "USUÁRIO:"
          echo "zezin"
          echo ""
          echo "SENHA:"
          echo "zezin123"
          echo ""
          echo "========================================"

      - name: Manter máquina ativa
        shell: bash
        run: |
          while true; do
            echo "Virtual PC ativo: $(date)"
            sleep 60
          done
